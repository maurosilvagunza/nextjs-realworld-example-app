name: Playwright & Jest cI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
   
  jobs:
    test: timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
          
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      
      - name: Instalar Dependencias
        run: npm ci
        
      - name: Instalar Navegador Playwright (Chromium)
        run: npx playwright install chromium --with-deps
       
      - name: Executar Testes Unitários e de API (jest)
        run: npx jest
        
      - name: Executar Testes E2E (Playwright)
        run: npx playwright test
      
      - name: Armazenar Relatório do Playwright
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
